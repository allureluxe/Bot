name: Tests

# NOTE : ce depot n'execute PLUS le bot de trading dans GitHub Actions.
# Deux raisons rendaient cela impossible :
#   1. Binance renvoie HTTP 451 aux runners GitHub (adresses IP restreintes),
#   2. chaque run repart d'un conteneur vierge : les positions ouvertes
#      etaient perdues a chaque redemarrage et jamais refermees.
# Le bot doit tourner sur un VPS (voir la section Deploiement du README).

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check that all modules import
        run: python -c "import scalper.engine, scalper.backtest, scalper.preflight"
